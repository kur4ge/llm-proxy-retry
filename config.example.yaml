server:
  listen: ":8080"
  read_header_timeout: 10s
  idle_timeout: 120s
  shutdown_timeout: 15s
  max_request_body_bytes: 67108864
  memory_request_body_bytes: 1048576
  max_inspect_response_body_bytes: 4194304
  temp_dir: ""

transport:
  dial_timeout: 10s
  tls_handshake_timeout: 10s
  idle_conn_timeout: 90s
  expect_continue_timeout: 1s
  max_idle_conns: 256
  max_idle_conns_per_host: 64

routes:
  - prefix: /A
    strip_prefix: true
    backends:
      - name: provider-a
        url: https://api-a.example.com
        weight: 3
        retry_delay: 2s
        max_retry_duration: 600s
        attempt_timeout: 60s
        retry_statuses: [429, 500, 502, 503, 504]
        retry_keywords:
          - rate limit
          - overloaded
        retry_network_errors: true
        preserve_host: false

      - name: provider-b
        url: https://api-b.example.com/v1
        weight: 1
        retry_delay: 5s
        max_retry_duration: 600s
        attempt_timeout: 60s
        retry_statuses: [429, 503]
        retry_keywords:
          - temporarily unavailable
        retry_network_errors: true
        preserve_host: false
